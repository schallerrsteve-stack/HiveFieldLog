<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00ADEF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FieldLog">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>FieldLog – borehole field logging</title>
<style>:root{
  /* Hive Engineering palette: main blue #00ADEF, light blue #E5F8FF, green #C2D64A, yellow #FFDF00, logo grey #58595B */
  --ink:#232527; --muted:#58595B; --line:#d3dde2; --bg:#f2f7f9; --card:#fff;
  --acc:#00ADEF; --acc-ink:#0F2A36; --acc-dark:#00729E; --acc-soft:#E5F8FF;
  --green:#C2D64A; --green-ink:#2F3A00; --yellow:#FFDF00; --yellow-soft:#FFF8C7; --yellow-ink:#4A3B00;
  --warn:#8A6A00; --warn-soft:#FFF8C7;
  --bad:#b3261e; --bad-soft:#fdecea; --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
a{color:var(--acc-dark)}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--acc);color:var(--acc-ink);display:flex;align-items:center;gap:8px;padding:8px 10px;min-height:56px;padding-top:max(8px,env(safe-area-inset-top))}
.top .tt{flex:1;min-width:0}
.top .tt b{display:block;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tt small{display:block;opacity:.85;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;border-radius:10px;color:inherit;text-decoration:none;font-size:22px;background:transparent;border:0;cursor:pointer}
.ib:active{background:rgba(255,255,255,.35)}
.tabs{position:sticky;top:56px;z-index:19;display:flex;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs a{flex:1;text-align:center;padding:12px 6px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;font-size:16px}
.tabs a.on{color:var(--acc-dark);border-bottom-color:var(--acc)}
.tabs a i{font-style:normal;font-size:12px;background:var(--bg);border-radius:10px;padding:1px 7px;margin-left:4px;color:var(--muted)}
.wrap{max-width:820px;margin:0 auto;padding:14px 12px 120px}
.wrap.wide{max-width:1100px}
h2{font-size:19px;margin:22px 0 10px}
h3{font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:22px 0 8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border-radius:var(--radius);border:1.5px solid var(--line);background:#fff;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.bad{color:var(--bad);border-color:#efc4c0}
.btn.sm{min-height:40px;padding:0 12px;font-size:15px}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5}
.list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-decoration:none;color:inherit;cursor:pointer;text-align:left;width:100%}
.card:active{background:#f7f8f9}
.ct{font-weight:700;font-size:18px}
.cs{color:var(--muted);font-size:15px;margin-top:2px}
.cm{color:var(--muted);font-size:13px;margin-top:6px}
.item{display:flex;gap:12px;align-items:flex-start}
.item .dep{font-variant-numeric:tabular-nums;font-weight:700;min-width:92px;font-size:15px}
.item .sw{flex:0 0 34px;height:44px;border:1px solid #999;border-radius:4px;background:#fff;overflow:hidden}
.item .bd{flex:1;min-width:0;font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--bg);color:var(--muted);margin-right:4px}
.tag.ok{background:var(--green);color:var(--green-ink)}
.tag.warn{background:var(--yellow-soft);color:var(--yellow-ink)}
.note{background:var(--yellow-soft);color:var(--yellow-ink);border-left:5px solid var(--yellow);border-radius:var(--radius);padding:10px 14px;margin:10px 0;font-size:15px}
.note.info{background:var(--acc-soft);color:#0F3A4C;border-left-color:var(--acc)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty h2{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 14px}
.fld{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.fld>span{font-size:14px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:17px}
.fld textarea{min-height:80px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.fld.wide{grid-column:1/-1}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.chip{min-height:42px;padding:0 13px;border-radius:21px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:15px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.lbl{font-size:14px;font-weight:600;color:var(--muted);margin-top:12px}
.mods{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center}
.mods .chips{margin:2px 0}
.mods .chip{min-height:38px;padding:0 11px}
.desc{background:#fafbfc;border:1.5px dashed var(--line);border-radius:10px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;min-height:46px}
.calc{font-weight:700;color:var(--acc-dark);font-size:16px;padding:6px 0}
.ov{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:820px;height:94vh;height:94dvh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
@media (min-width:860px){.ov{align-items:center}.sheet{height:88vh;border-radius:16px}}
.sh-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.sh-h b{flex:1;text-align:center;font-size:18px}
.sh-b{flex:1;overflow-y:auto;padding:6px 16px 24px;-webkit-overflow-scrolling:touch}
.sh-f{display:flex;gap:10px;padding:10px 12px;border-top:1px solid var(--line);padding-bottom:max(10px,env(safe-area-inset-bottom))}
.sh-f .sp{flex:1}
.dlg{background:#fff;border-radius:16px;padding:20px;max-width:440px;width:calc(100% - 24px);margin:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.dlg h2{margin-top:0}
.ov.c{align-items:center}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#22272b;color:#fff;padding:12px 18px;border-radius:12px;z-index:90;max-width:90vw;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad)}
.logs{display:flex;flex-direction:column;gap:16px;margin-top:14px}
.logpage{width:100%;height:auto;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15);border-radius:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.sec{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:4px 14px 10px;margin:12px 0}
.gps{display:flex;gap:8px;align-items:flex-end}
.gps .fld{flex:1}
.hidden{display:none}
.pill{border:0;border-radius:16px;padding:6px 11px;font-size:13px;font-weight:700;background:rgba(255,255,255,.55);color:var(--acc-ink);white-space:nowrap;cursor:pointer;max-width:42vw;overflow:hidden;text-overflow:ellipsis}
.pill.ok{background:var(--green);color:var(--green-ink)}
.pill.warn{background:var(--yellow);color:var(--yellow-ink)}
.pill.bad{background:#ffb4ab;color:#5c0d07}
.top .tt b{font-weight:800}
.brand{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:10px}
.brand img{height:62px;width:auto}
.logo-prev{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;display:inline-block;margin:6px 0}
.logo-prev img{height:60px;width:auto;display:block}

/* ---------- office (desktop) ---------- */
.row .sp{flex:1}
.tag.rv{background:var(--acc-soft);color:#00577A}
.note.ok-note{background:#F3F8DC;color:var(--green-ink);border-left-color:var(--green)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin-top:4px}
.seg button{border:0;background:#fff;padding:10px 18px;font-weight:700;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acc);color:var(--acc-ink)}
.hist summary{cursor:pointer;padding:6px 0;list-style:none}
.htab{width:100%;border-collapse:collapse;font-size:13px}
.htab td{padding:4px 6px;border-top:1px solid var(--line);vertical-align:top}
.htab td:first-child{white-space:nowrap;color:var(--muted);width:1%}
.htab td:nth-child(2){white-space:nowrap;width:1%}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(380px,0.85fr);gap:16px;padding:14px 16px 60px;max-width:1700px;margin:0 auto}
.split .ed{min-width:0}
.pv{position:sticky;top:112px;align-self:start;max-height:calc(100vh - 124px);overflow:auto;background:#e8eef1;border-radius:12px;padding:10px}
.pv-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pv .logs{margin-top:0;gap:10px}
.grid-t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;margin-top:10px;font-size:14px}
.grid-t th{background:var(--acc-soft);text-align:left;font-size:12px;padding:7px 6px;border-bottom:1px solid var(--line);position:sticky;top:104px;z-index:2}
.grid-t td{border-bottom:1px solid #eef1f3;padding:3px 4px;vertical-align:top}
.grid-t input,.grid-t select,.grid-t textarea{width:100%;font-size:14px;padding:6px 6px;border:1px solid transparent;border-radius:6px;background:transparent;min-height:32px}
.grid-t textarea{resize:vertical;font-family:inherit;line-height:1.35}
.grid-t input:hover,.grid-t select:hover,.grid-t textarea:hover{border-color:var(--line)}
.grid-t input:focus,.grid-t select:focus,.grid-t textarea:focus{outline:none;border-color:var(--acc);background:#fff;box-shadow:0 0 0 2px var(--acc-soft)}
.grid-t input:disabled,.grid-t select:disabled,.grid-t textarea:disabled{color:var(--ink);opacity:1}
.grid-t .act{white-space:nowrap;text-align:right}
.grid-t .calc-c{font-weight:700;color:var(--acc-dark);padding-top:9px}
.grid-t tr.warnrow td{background:#FFFBE3}
.wmsg{font-size:12px;color:var(--warn);padding:0 6px 4px}
.mini{border:1px solid var(--line);background:#fff;border-radius:6px;min-width:28px;height:28px;cursor:pointer;font-size:14px;margin-left:3px}
.mini.del{color:var(--bad)}
.mini:hover{border-color:var(--acc)}
.ov-t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);margin-top:14px;font-size:14px}
.ov-t th{background:var(--acc-soft);text-align:left;padding:9px 8px;font-size:12px;border-bottom:1px solid var(--line)}
.ov-t td{padding:9px 8px;border-bottom:1px solid #eef1f3}
.ov-t tr[data-a]{cursor:pointer}
.ov-t tr[data-a]:hover td{background:#f5fbfe}
.ov-t .r{text-align:right;font-variant-numeric:tabular-nums}
.tool{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.tool-side{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 14px 14px;position:sticky;top:70px}
.tool-main .logs{margin-top:0}
.flist{display:flex;flex-direction:column;gap:2px;max-height:42vh;overflow:auto}
.fitem{display:flex;justify-content:space-between;align-items:center;padding:4px 2px;border-bottom:1px solid #eef1f3}
.fitem.off{opacity:.6}
.fitem label{cursor:pointer}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:15px;cursor:pointer}
.chk input{width:20px;height:20px}
@media (max-width:999px){.tool{grid-template-columns:1fr}.tool-side{position:static}}
body.desk .wrap{max-width:1100px}
.m3{height:calc(100vh - 100px);min-height:420px;border-radius:12px;overflow:hidden;background:#f2f7f9;border:1px solid var(--line);position:relative}
.m3 canvas{display:block;touch-action:none}
@media (max-width:999px){.m3{height:68vh}}
.sw3{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.25);vertical-align:-2px;margin-right:2px}
.chk.off{opacity:.45}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 16px}
.tgrid textarea{font-size:15px;line-height:1.35}
.tgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0 14px}
.tcols td,.tcols th{padding:5px 6px;text-align:left}
.tcols input[type=checkbox]{width:20px;height:20px}
.tplbar{margin:6px 0 12px}
.gfx-t td{vertical-align:middle}
.gfx-t input[type=color]{width:56px;height:34px;padding:0;border:1px solid var(--line);border-radius:6px;background:#fff}
.gfx-t .sw{width:30px;height:40px;border:1px solid #999;border-radius:4px}
.gwres{background:var(--blue2,#E5F8FF);border-radius:8px;padding:8px 10px;margin:6px 0 10px;font-size:13px}
.gwres .gwi{font-size:18px;font-weight:700;color:#0B5FA5}
.gwres .htab{margin-top:6px;font-size:12px}.gwres .htab th{text-align:left;font-weight:600;padding:3px 6px}
.gwres .htab td,.gwres .htab td:first-child{color:inherit;width:auto}
.grid-t input.nin{font-weight:700}.grid-t input.nin::placeholder{color:#00729E;font-weight:700;opacity:.8}
/* 3D page: model stays put, options panel scrolls on its own */
.tool-side{max-height:calc(100vh - 84px);overflow-y:auto;overscroll-behavior:contain}
.tool-main.stick{position:sticky;top:70px}
.tool-main.stick .m3{height:calc(100vh - 86px)}
@media (max-width:999px){.tool-side{max-height:none;overflow:visible}.tool-main.stick{order:-1;top:58px;z-index:5;background:var(--bg,#f2f7f9);padding-bottom:6px}.tool-main.stick .m3{height:46vh;min-height:300px}}
.wz-t td{vertical-align:middle}.wz-t td:nth-child(3){display:flex;align-items:center;gap:6px}.wsw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid #0003;flex:none}
@media (min-width:1000px){.wrap.m3page{padding-bottom:8px}.m3page .tool-side{max-height:calc(100vh - 96px)}.m3page .tool-main.stick .m3{height:calc(100vh - 96px)}}
/* ---------- hydraulic conductivity tests ---------- */
.ktplot{width:100%;height:auto;display:block}
.ktplotw{background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px;margin:8px 0;overflow:hidden}
.ktres{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.ktk{font-size:24px;font-weight:800;color:#00577A;margin:2px 0}
sup{font-size:.68em;line-height:0}
.ktt td,.ktt td:first-child{white-space:normal;width:auto}
.ktt td:first-child{width:42%;color:var(--muted)}
.ktbig{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.ktclock .row{align-items:center}
.ktrec{min-height:64px;font-size:20px;padding:0 24px}
.kttab input{font-size:17px}
.fld small{font-size:12px;line-height:1.3}
.chip[disabled],.seg button[disabled]{opacity:.55}
.netp{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:5px 11px 5px 8px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;flex:none;max-width:46vw;overflow:hidden}
.netp svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.netp .full{overflow:hidden;text-overflow:ellipsis}
.netp.on{background:#C2D64A;color:#1f2a05}
.netp.off{background:#FFDF00;color:#3a2f00;box-shadow:0 0 0 2px #0F2A36 inset}
.netp .short{display:none}
@media (max-width:720px){.netp .full{display:none}.netp .short{display:inline}}
.grid-t tr.blank td{background:#fbfeff}.grid-t tr.blank input,.grid-t tr.blank select,.grid-t tr.blank textarea{background:transparent;border-color:#e3eef3}.grid-t tr.blank select{color:#8a99a3}
.hmap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin:4px 0 14px;overflow:hidden}
.hmap-t{all:unset;box-sizing:border-box;display:flex;align-items:baseline;gap:10px;width:100%;padding:10px 14px;cursor:pointer}.hmap-t b{font-size:16px}.hmap-t .chev{margin-left:auto;color:#00729E}
.hmap-b{position:relative;border-top:1px solid var(--line)}
.hmap-svg{height:380px;touch-action:none;cursor:grab;background:#E5F8FF;user-select:none}.hmap-svg:active{cursor:grabbing}.hmap-svg svg{width:100%;height:100%;display:block}
.hmap-svg .mh{cursor:pointer}
.hmap-tools{position:absolute;top:8px;left:8px;display:flex;gap:4px}.hmap-tools .mini{background:#fff;border:1px solid var(--line);min-width:30px;height:30px;font-size:17px;font-weight:700;box-shadow:0 1px 3px #0002}.hmap-tools .mini.wide{font-size:12px;padding:0 8px}
.hmap-leg{display:flex;flex-wrap:wrap;gap:4px 14px;padding:8px 12px;font-size:13px;border-top:1px solid var(--line)}.hmap-leg label{display:flex;align-items:center;gap:5px;cursor:pointer}.msym{width:15px;height:15px}
.hmap-pop{position:absolute;top:46px;left:8px;max-width:300px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:0 4px 16px #0003;font-size:14px}.hmap-pop .row{margin-top:8px}
.hmap-empty{position:absolute;inset:auto 0 60px 0;text-align:center;color:#4b6470;font-size:14px;pointer-events:none}
body.desk .wrap .hmap-svg{height:440px}
@media (max-width:600px){.hmap-svg{height:300px}}
.conv{background:var(--acc-soft,#E5F8FF);border-radius:10px;padding:8px 10px;margin:8px 0}.conv .fld{margin:0 0 6px}.conv .row{margin:0;gap:8px;flex-wrap:wrap}
.hsw{display:flex;align-items:center;gap:6px;min-width:0}
.hsw-sel{position:relative;display:inline-flex;align-items:center;gap:4px;min-width:0;max-width:100%;border-radius:8px;padding:0 6px 0 4px;margin-left:-4px;cursor:pointer}
.hsw-sel:hover,.hsw-sel:focus-within{background:#ffffff33}
.hsw-sel b{font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsw-sel select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.hsw-c{font-size:14px;opacity:.85}
.hsw-nav{display:inline-flex;gap:2px;flex:none}
.hsw-b{border:0;background:#ffffff40;color:inherit;width:28px;height:26px;border-radius:7px;font-size:18px;line-height:1;cursor:pointer;font-weight:700}.hsw-b:disabled{opacity:.35;cursor:default}.hsw-b:not(:disabled):hover{background:#ffffff70}
.hmap-miss{padding:6px 12px 10px;border-top:1px solid var(--line);font-size:13px}.hmap-miss summary{cursor:pointer;color:#00729E;font-weight:600}.hmap-miss ul{margin:6px 0 0;padding-left:18px}.hmap-miss li{margin:2px 0}
.ftnote{background:#FFF6C2;border-left:4px solid #FFDF00;border-radius:8px;padding:7px 12px;margin:0 0 10px;font-size:14px;color:#3a2f00}
.drill-btns{flex-wrap:wrap}.btn.big{font-size:17px;padding:12px 18px;min-height:52px}
.spc{display:flex;align-items:stretch;gap:8px;padding:0;background:#f7fbfd;border-left:4px solid #00ADEF}.spc-b{all:unset;box-sizing:border-box;flex:1;display:flex;gap:10px;padding:10px 12px;cursor:pointer;align-items:center}
.spc .describe{align-self:center;margin-right:8px;white-space:nowrap}.tag.sp{background:#0F2A36;color:#fff}.blw{font-size:16px;letter-spacing:.5px}
.spn-dep{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spn-boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0}
.spn-box{border:2px solid var(--line);border-radius:12px;background:#fff;padding:6px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font:inherit}
.spn-box small{font-size:12px;color:#5c7480}.spn-box b{font-size:30px;line-height:1.15;min-height:36px}.spn-box.on{border-color:#00ADEF;background:#E5F8FF;box-shadow:0 0 0 3px #00ADEF55}
.spn-n{text-align:center;font-size:18px;margin:2px 0 8px}.spn-n b{font-size:24px;color:#00729E}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;user-select:none}
.kp button{font:inherit;font-size:28px;font-weight:700;min-height:62px;border-radius:14px;border:1px solid var(--line);background:#fff;cursor:pointer;touch-action:manipulation}
.kp button:active{background:#E5F8FF}.kp .kp-w{font-size:17px}.kp .kp-nx{grid-column:span 2;background:#00ADEF;color:#0F2A36;border-color:#00ADEF}
.spn-more{margin-top:12px}.spn-more summary{cursor:pointer;font-weight:600;color:#00729E;padding:6px 0}
.btn.pulse{animation:pls 1s 2}@keyframes pls{50%{box-shadow:0 0 0 6px #00ADEF66}}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.run .rdesc{font-size:14px;margin-top:3px;color:#0F2A36}.run .warn{color:var(--warn);font-weight:600}.sw.nod{width:10px;border:1px dashed #b5c4cb;border-radius:2px;align-self:stretch}
.run-types .chips{margin-bottom:4px}.rec-q{display:flex;gap:6px;margin-bottom:4px}.rec-q .chip{flex:1;min-height:44px;font-size:16px}
.run-desc-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;border-top:2px solid var(--line);padding-top:10px}.run-desc-h h3{margin:0}
.run-desc-h .btn{min-height:44px;font-size:15px}.sb-auto{background:#EEF6D5;border-left:4px solid #C2D64A}.sb-man{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
</style>
</head>

    if (k === 1) cv.text(v >= 1 ? String(v) : v.toFixed(-d), x - 1.4 * F, yy + 1 * F, { size: 6.5 * F, align: 'right', color: INK });
  }
  for (let t = 0; t <= xmax + 1e-9; t += step) { const xx = X(t); cv.line(xx, y, xx, y + h, 0.1, GRID); cv.text(t >= 1000 && step >= 100 ? String(Math.round(t)) : String(+t.toFixed(3)), xx, y + h + 3.4 * F, { size: 6.5 * F, align: 'center', color: INK }); }
  cv.rect(x, y, w, h, { stroke: '#7a858b', lw: 0.3 });
  cv.text('Elapsed time, t (s)', x + w / 2, y + h + 7.6 * F, { size: 7 * F, align: 'center', bold: true, color: INK });
  cv.text('H/H0 (log scale)', x + 1.5, y - 1.6, { size: 7 * F, bold: true, color: INK });
  // fitted line
  if (R.fit && R.H0) {
    const f = t => Math.exp(R.fit.a + R.fit.b * t) / R.H0;
    const lo = 10 ** d0, hi = 10 ** d1;

  if (o.pick != null && o.pick <= xmax) cv.line(X(o.pick), y, X(o.pick), y + h, 0.3, '#b3261e', [1, 1]);
  for (const p of shown) {
    if (p.hn < 10 ** d0 || p.hn > 10 ** d1) continue;
    if (p.used) cv.circle(X(p.t), Y(p.hn), 0.75 * mk, { fill: BLUE, stroke: '#00577A', lw: 0.15 });

/* Raw transducer record: value against time since the start of the file. Click a point to set the test start. */
function ktRawSvg(P, T) {
  const r = T.raw; if (!r || !r.pts || !r.pts.length) return '';
  const W = 130, H = 62, cv = SvgCanvas(W, H); cv.page();
  const x = 17, y = 4, w = W - 20, h = H - 17, ts = r.pts.map(p => p[0]), vs = r.pts.map(p => p[1]);
  const tA = ts[0], tB = ts.at(-1), vA = Math.min(...vs), vB = Math.max(...vs), pad = (vB - vA) * 0.06 || 0.01;
  const X = t => x + (t - tA) / Math.max(1e-9, tB - tA) * w, Y = v => y + h - (v - vA + pad) / (vB - vA + 2 * pad) * h;
  cv.rect(x, y, w, h, { stroke: '#7a858b', lw: 0.25, fill: '#fff' });
  const span = tB - tA, mins = span > 600, st = niceStep(mins ? span / 60 : span, 6);
  for (let k = 0; k * st <= (mins ? span / 60 : span) + 1e-9; k++) { const t = tA + k * st * (mins ? 60 : 1); cv.line(X(t), y, X(t), y + h, 0.1, '#d9e1e5'); cv.text(String(+(k * st).toFixed(2)), X(t), y + h + 4.4, { size: 6 * 1.35, align: 'center' }); }
  const vs2 = niceStep(vB - vA + 2 * pad, 4); for (let v = Math.ceil((vA - pad) / vs2) * vs2; v <= vB + pad; v += vs2) { cv.line(x, Y(v), x + w, Y(v), 0.1, '#d9e1e5'); cv.text(v.toFixed(vs2 < 0.01 ? 3 : 2), x - 1.2, Y(v) + 1, { size: 6 * 1.35, align: 'right' }); }
  cv.text(`Time from start of file (${mins ? 'min' : 's'})`, x + w / 2, y + h + 9.4, { size: 6.5 * 1.35, bold: true, align: 'center' });
  const sr = ktSeries(P, T); if (sr.base != null) cv.line(x, Y(sr.base), x + w, Y(sr.base), 0.3, '#8A6A00', [1, 1]);
  const step = Math.max(1, Math.ceil(r.pts.length / 900)); let path = [];
  for (let i = 0; i < r.pts.length; i += step) path.push([X(r.pts[i][0]), Y(r.pts[i][1])]);
  for (let i = 1; i < path.length; i++) cv.line(path[i - 1][0], path[i - 1][1], path[i][0], path[i][1], 0.25, '#0095D0');
  const t0 = num(r.t0); if (t0 != null) { cv.line(X(t0), y, X(t0), y + h, 0.4, '#b3261e'); cv.text('start', X(t0) + 0.8, y + 3, { size: 6 * 1.35, color: '#b3261e' }); }
  let ov = ''; const os = Math.max(1, Math.ceil(r.pts.length / 400));
  for (let i = 0; i < r.pts.length; i += os) ov += `<rect x="${r2(X(r.pts[i][0]) - 0.6)}" y="${y}" width="1.2" height="${h}" fill="transparent" data-a="kt-t0" data-t="${r.pts[i][0]}" style="cursor:crosshair"/>`;
  return `<svg class="ktplot" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${cv.pages[0].join('')}${ov}</svg>`;
}

      if (!T.timerStart || T.timerEnd) return;
      const t = Math.round((Date.now() - T.timerStart) / 100) / 10;
      const rs = T.readings = T.readings || [];
      const blank = rs.findIndex(r => (r.v ?? '') === '');
      if (blank >= 0 && blank === rs.length - 1) rs[blank].t = String(t); else rs.push({ t: String(t), v: '' });
      ktTouch(P, h, T, 'reading added'); renderMain();
      const inp = document.getElementById('ktv-' + (T.readings.length - 1)); if (inp) { inp.focus(); inp.scrollIntoView({ block: 'center' }); }
      return;
    }
    case 'kt-addrow': { const rs = T.readings = T.readings || []; const lt = rs.length ? ktParseT(rs.at(-1).t) : null; rs.push({ t: lt != null ? String(KT_SCHED.find(x => x > lt) || lt + 60) : '0', v: '' }); ktTouch(P, h, T, 'reading added'); renderMain(); const inp = document.getElementById('ktv-' + (rs.length - 1)); if (inp) inp.focus(); return; }
    case 'kt-delrow': T.readings.splice(+el.dataset.i, 1); ktTouch(P, h, T, 'reading removed'); return renderMain();
    case 'kt-import': { let inp = $('#ktIn'); if (!inp) { inp = document.createElement('input'); inp.type = 'file'; inp.id = 'ktIn'; inp.className = 'hidden'; inp.accept = '.csv,.txt,.xle,.dat,text/csv,text/plain'; document.body.appendChild(inp); } inp.click(); return; }
    case 'kt-imp-cancel': S.ktImp = null; return ktOverlay('');
    case 'kt-imp-ok': {
      const I = S.ktImp; try {
        const r = ktImportPoints(I.tab, I.cfg, P); const t0 = ktDetectStart(r.pts); const thin = ktThin(r.pts, t0);
        const d = new Date(r.absStart * 1000);
        T.raw = { file: I.name, kind: I.cfg.kind, unit: I.cfg.unit, n: r.pts.length, pts: thin, t0: String(t0), startText: I.cfg.tmode === 'clock' ? d.toISOString().slice(0, 19).replace('T', ' ') : '' };
        T.collect = 'transducer'; if (T.a) { T.a.base0 = ''; T.a.auto = T.a.auto === 'manual' ? 'butler' : T.a.auto; T.a.h0Mode = 'max'; }
        S.ktImp = null; ktOverlay(''); ktTouch(P, h, T, 'transducer file imported'); toast(`Imported ${r.pts.length} readings · start found at ${ktTime(t0)}`); return go(`/p/${P.id}/h/${h.id}/kt/${T.id}/readings`);
      } catch (e) { toast(e.message, true); return; }
    }
    case 'kt-t0auto': if (T.raw) { T.raw.t0 = String(ktDetectStart(T.raw.pts)); ktTouch(P, h, T, 'start time found automatically'); renderMain(); } return;
    case 'kt-t0': if (T.raw) { const t = +el.dataset.t; const i = T.raw.pts.findIndex(p => p[0] >= t); T.raw.t0 = String(T.raw.pts[Math.max(0, i)][0]); ktTouch(P, h, T, 'start time changed'); renderMain(); } return;
    case 'kt-pt': {
      const t = +el.dataset.t;
      if (S.ktPick == null) { S.ktPick = t; return ktRefresh(); }
      const a1 = Math.min(S.ktPick, t), a2 = Math.max(S.ktPick, t); S.ktPick = null;
      if (a1 === a2) return ktRefresh();
      T.a.t1 = String(a1); T.a.t2 = String(a2); T.a.auto = 'manual'; T.analysedBy = whoAmI(); ktTouch(P, h, T, 'fit range picked'); return renderMain();
    }
    case 'kt-fit': T.a.auto = el.dataset.v; T.a.t1 = ''; T.a.t2 = ''; S.ktPick = null; T.analysedBy = whoAmI(); ktTouch(P, h, T, 'fit range set'); return renderMain();
    case 'kt-review': return ktSetReview(P, h, T, el.dataset.v);
    case 'kt-pdf': case 'kt-pdf-all': {
      if (!window.jspdf) { toast('PDF engine failed to load', true); return; }
      toast('Building PDF…'); await new Promise(r => setTimeout(r, 30));
      try {
        const doc = new window.jspdf.jsPDF({ unit: 'mm', format: S.settings.paper === 'a4' ? 'a4' : 'letter' }); const cv = PdfCanvas(doc);
        if (a === 'kt-pdf') { ktReport(cv, P, h, T, ktAnalyse(P, h, T)); doc.setProperties({ title: `${h.holeId} ${T.testId} hydraulic conductivity`, creator: 'FieldLog ' + VERSION }); return deliver(doc.output('blob'), `${safeName(P.number || P.name)}_${safeName(h.holeId)}_${safeName(T.testId)}_K.pdf`, 'Test report ready'); }
        const rows = ktProjectRows(P); ktSummaryPage(cv, P, rows); for (const r of rows) ktReport(cv, P, r.h, r.T, r.R);
        doc.setProperties({ title: `${P.name || ''} hydraulic conductivity`, creator: 'FieldLog ' + VERSION });
        return deliver(doc.output('blob'), `${safeName(P.number || P.name)}_K_tests.pdf`, 'K test reports ready', `Summary page plus ${rows.length} test report${rows.length === 1 ? '' : 's'}.`);
      } catch (e) { console.error(e); toast('PDF failed: ' + e.message, true); }
      return;
    }
    case 'kt-xlsx': return deliver(buildXlsx(P, ktXlsxSheets(P)), `${safeName(P.number || P.name)}_K_tests.xlsx`, 'Excel workbook ready', 'Sheets: K by well, K tests, K readings.');
  }
}

/* ---------------- example tests for the demo project ---------------- */
function ktDemo(mw, mw2) {
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647 - 0.5; };
  const base = (o) => ({ id: uid(), init: 'Solid slug', by: 'Example logger', mp: 'Top of casing', slugLen: '1.0', slugDia: '38', slugVol: '', sensorDepth: '', sensorSerial: '', notes: '', raw: null, timerStart: null, timerEnd: null, createdAt: now(), updatedAt: now(), review: 'Draft', ...o });
  const manual = (k, H0, sign) => [5, 10, 15, 20, 30, 45, 60, 75, 90, 120, 150, 180, 240, 300].map(t => ({ t: String(t), v: (2.95 + sign * H0 * Math.exp(-k * t) + rnd() * 0.006).toFixed(3) }));
  mw.slugTests = [
    base({ testId: 'ST-1', type: 'rising', date: '2026-10-24', time: '10:05', collect: 'manual', staticDTW: '2.95', staticTime: '09:58', readings: [{ t: '0', v: '3.560' }, ...manual(0.0147, 0.60, 1)],
      a: { method: 'BR', auto: 'butler', h0Mode: 'first', fp: 'auto', n: '0.30', kr: '1', hvCase: 'uniform', leBasis: 'screen', base: '6.0' }, review: 'Checked', reviewBy: 'Office reviewer', reviewAt: now(), analysedBy: 'Office reviewer' }),
    base({ testId: 'ST-2', type: 'falling', date: '2026-10-24', time: '10:20', collect: 'manual', staticDTW: '2.95', staticTime: '10:18', readings: [{ t: '0', v: '2.410' }, ...manual(0.0162, 0.55, -1)],
      a: { method: 'BR', auto: 'butler', h0Mode: 'first', fp: 'auto', n: '0.30', kr: '1', hvCase: 'uniform', leBasis: 'screen', base: '6.0' } })];
  // transducer record at MW-02: 0.5 s logging, slug pulled out after 60 s
  const pts = []; const k = 0.0092, H0 = 0.58, stat = 2.80;
  for (let t = 0; t <= 960; t += 0.5) { const dt = t - 60; const v = dt < 0 ? stat : stat - H0 * Math.exp(-k * dt) * (dt < 1 ? 0.97 : 1); if (dt > 120 && (t * 2) % 4 !== 0) continue; pts.push([t, Math.round((v + rnd() * 0.002) * 1e4) / 1e4]); }
  mw2.slugTests = [base({ testId: 'ST-1', type: 'rising', date: '2026-10-24', time: '11:40', collect: 'transducer', staticDTW: '1.80', staticTime: '11:30', slugLen: '', slugDia: '', slugVol: '1.2', sensorDepth: '4.6', sensorSerial: 'LT-2041887',
    readings: [], raw: { file: 'MW-02_slug_2026-10-24.csv', kind: 'head', unit: 'm', n: pts.length, pts, t0: '60', startText: '2026-10-24 11:39:00' },
    a: { method: 'BR', auto: 'butler', h0Mode: 'max', fp: 'auto', n: '0.30', kr: '1', hvCase: 'uniform', leBasis: 'screen', base: '5.1' } })];
}

const DB = {

    try {

      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('fieldlog', 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('projects', { keyPath: 'id' }); r.result.createObjectStore('meta'); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
      });

    } catch (e) {
      try { localStorage.setItem('_t', '1'); localStorage.removeItem('_t'); this.mode = 'ls'; } catch (e2) { this.mode = 'memory'; }
    }
  },
  _req(store, mode, fn) {
    return new Promise((res, rej) => { const tx = this.db.transaction(store, mode); const r = fn(tx.objectStore(store)); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); });
  },
  async all() {
    if (this.mode === 'idb') return (await this._req('projects', 'readonly', s => s.getAll())) || [];
    if (this.mode === 'ls') { try { return JSON.parse(localStorage.getItem('fieldlog.projects') || '[]'); } catch (e) { return []; } }
    return [];
  },
  async put(p) {
    if (this.mode === 'idb') return this._req('projects', 'readwrite', s => s.put(clone(p)));
    if (this.mode === 'ls') localStorage.setItem('fieldlog.projects', JSON.stringify(S.projects));
  },
  async del(id) {
    if (this.mode === 'idb') return this._req('projects', 'readwrite', s => s.delete(id));
    if (this.mode === 'ls') localStorage.setItem('fieldlog.projects', JSON.stringify(S.projects));
  },
  async getMeta(k) {
    if (this.mode === 'idb') return this._req('meta', 'readonly', s => s.get(k));
    if (this.mode === 'ls') { try { return JSON.parse(localStorage.getItem('fieldlog.' + k)); } catch (e) { return null; } }
    return null;
  },
  async setMeta(k, v) {
    if (this.mode === 'idb') return this._req('meta', 'readwrite', s => s.put(clone(v), k));
    if (this.mode === 'ls') localStorage.setItem('fieldlog.' + k, JSON.stringify(v));
  }
};

function parseHash() {

    if (p[2] === 'h' && p[3] && p[4] === 'kt' && p[5]) return { v: 'ktest', pid: p[1], hid: p[3], tid: p[5], tab: p[6] || 'setup' };
    if (p[2] === 'h' && p[3]) return { v: 'hole', pid: p[1], hid: p[3], tab: p[4] || 'info' };

/* navigator.onLine can say "online" on Wi-Fi with no internet (e.g. a site trailer hotspot), so confirm with a tiny request. */
async function netCheck() {
  if (navigator.onLine === false) return setOnline(false);
  if (IN_ARTIFACT || location.protocol === 'file:') return setOnline(true);
  try { const c = new AbortController(); const tm = setTimeout(() => c.abort(), 5000);
    const r = await fetch('./manifest.webmanifest?ping=' + Date.now(), { method: 'HEAD', cache: 'no-store', signal: c.signal }); clearTimeout(tm); setOnline(r.ok || r.status < 500);
  } catch (e) { setOnline(false); }
}

function fld(label, scope, f, val, o = {}) {

  const cv = (scope === 'hole' || scope === 'draft') ? cvOf(f) : '';
  if (cv) { val = toShow(val, cv); label = cvLabel(label, cv); if (o.ph) o = { ...o, ph: String(o.ph).replace(/auto: ([\d.]+)/, (m, x) => 'auto: ' + toShow(x, cv)) }; }
  const a = `id="${id}" data-s="${scope}" data-f="${f}"${cv ? ` data-cv="${cv}"` : ''}${LOCK && scope === 'hole' ? ' disabled' : ''}`;
  let input;
  if (o.type === 'select') input = `<select ${a}>${o.options.map(op => { const [v, l] = Array.isArray(op) ? op : [op, op]; return `<option value="${esc(v)}"${String(val ?? '') === String(v) ? ' selected' : ''}>${esc(l)}</option>`; }).join('')}</select>`;
  else if (o.type === 'textarea') input = `<textarea ${a} rows="${o.rows || 3}" placeholder="${esc(o.ph || '')}">${esc(val)}</textarea>`;
  else input = `<input ${a} type="${o.type || 'text'}"${o.im ? ` inputmode="${o.im}"` : ''}${o.list ? ` list="${o.list}"` : ''} placeholder="${esc(o.ph || '')}" value="${esc(val)}" autocomplete="off"${o.ro ? ' readonly' : ''}>`;
  return `<label class="fld ${o.cls || ''}" for="${id}"><span>${esc(label)}</span>${input}</label>`;
}

  const en = llToEN(la, lo, c); if (!en || !isFinite(en[0])) return false; const f = P.units === 'ft' ? 0.3048 : 1, dp = P.units === 'ft' ? 2 : 3;

    <div class="row"><button class="btn sm pri" data-a="conv-ll-en">Lat/long → Easting/Northing</button><button class="btn sm" data-a="conv-en-ll">Easting/Northing → Lat/long</button></div></div>`;

document.addEventListener('change', e => { if (e.target && e.target.id === 'convCrs') { const h = curH(); if (h) S.convCrs = { h: h.id, epsg: +e.target.value }; } });
function convAction(a, P, h) {
  if (isLocked(h)) return;
  const c = crsByEpsg(+(($('#convCrs') || {}).value || convDefault(P, h))); if (!c) return toast('Pick a coordinate system');
  const f = P.units === 'ft' ? 0.3048 : 1, dp = P.units === 'ft' ? 2 : 3;
  if (a === 'conv-ll-en') {

    if (typed && S.convArm !== h.id + c.epsg) { S.convArm = h.id + c.epsg; setTimeout(() => { if (S.convArm === h.id + c.epsg) S.convArm = null; }, 6000); return toast('This hole has a typed-in easting/northing. Tap again to replace it.'); }

    h.easting = (en[0] / f).toFixed(dp); h.northing = (en[1] / f).toFixed(dp); h.coordSys = c.short; h.enAuto = true;
    let msg = `Converted to ${c.short}: E ${h.easting}, N ${h.northing}`;
    if (!P.crs) { P.crs = String(c.epsg); P.infoUpdatedAt = now(); save(P); markProject(P); msg += `. Project coordinate system set to ${c.short}, so other holes will convert automatically.`; }

/* ---------------- import / export / merge ---------------- */
function exportJson(projects, name) {
  const data = { format: 'fieldlog', version: 1, exportedAt: now(), exportedBy: S.settings.logger || '', projects };
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const t = now(); for (const p of projects) { p.lastExport = t; persist(p); }
  deliver(blob, name, 'Export ready', 'Send this file to the office, or keep it as a backup. It can be imported on any device running FieldLog.');
  setTimeout(renderMain, 50);
}
function mergeProject(inc, stats) {
  inc = normP(inc);
  let ex = S.projects.find(p => p.id === inc.id);
  if (!ex && inc.number) ex = S.projects.find(p => (p.number || '').trim().toLowerCase() === inc.number.trim().toLowerCase());
  if (!ex) { inc.lastExport = null; S.projects.push(inc); stats.newProjects++; stats.newHoles += inc.holes.length; save(inc); markProject(inc); inc.holes.forEach(h => markHole(inc, h)); return; }
  const del = new Set([...ex.deleted, ...inc.deleted]);
  if ((inc.infoUpdatedAt || '') > (ex.infoUpdatedAt || '')) {
    for (const k of ['name', 'number', 'client', 'location', 'units', 'entryUnits', 'depthPerPage', 'notes', 'fence', 'crs', 'site', 'gw']) ex[k] = inc[k];
    ex.infoUpdatedAt = inc.infoUpdatedAt; markProject(ex);
  }
  for (const h of inc.holes) {
    if (del.has(h.id)) continue;
    const i = ex.holes.findIndex(x => x.id === h.id);
    if (i < 0) { ex.holes.push(h); stats.newHoles++; markHole(ex, h); }
    else if (tsCmp(h.updatedAt, ex.holes[i].updatedAt) > 0) { ex.holes[i] = h; stats.updated++; markHole(ex, h); }
    else stats.same++;
  }
  const before = ex.holes.length; const t = now(); ex.holes.forEach(h => { if (del.has(h.id)) markDirty(`x:${ex.id}:${h.id}:${t}`); }); ex.holes = ex.holes.filter(h => !del.has(h.id)); stats.removed += before - ex.holes.length;
  ex.deleted = [...del]; save(ex);

document.addEventListener('change', async e => {
  if (e.target.id === 'tplIn') { const f = e.target.files[0]; e.target.value = ''; if (f) tplImportFile(f); return; }
  if (e.target.id === 'logoIn') { const f = e.target.files[0]; e.target.value = ''; if (f) loadLogo(f); return; }
  if (e.target.id !== 'fileIn') return;
  const files = [...e.target.files]; e.target.value = '';
  const stats = { files: 0, newProjects: 0, newHoles: 0, updated: 0, same: 0, removed: 0, bad: [] };
  for (const f of files) {
    try {
      const data = JSON.parse(await f.text());
      if (data.format !== 'fieldlog' || !Array.isArray(data.projects)) throw new Error('not a FieldLog file');
      data.projects.forEach(p => mergeProject(p, stats)); stats.files++;
    } catch (err) { stats.bad.push(`${f.name}: ${err.message}`); }
  }
  await flush();
  S.dialog = { type: 'info', title: 'Import complete', html: `<p>${stats.files} file${stats.files === 1 ? '' : 's'} merged.</p><ul>
    <li>${stats.newProjects} new project${stats.newProjects === 1 ? '' : 's'}</li><li>${stats.newHoles} new hole${stats.newHoles === 1 ? '' : 's'}</li>
    <li>${stats.updated} hole${stats.updated === 1 ? '' : 's'} updated with newer edits</li><li>${stats.same} already up to date</li>
    ${stats.removed ? `<li>${stats.removed} removed (deleted on another device)</li>` : ''}</ul>
    ${stats.bad.length ? `<p style="color:var(--bad)">Skipped: ${stats.bad.map(esc).join('<br>')}</p>` : ''}` };

const r2 = v => Math.round(v * 100) / 100;

    line(x1, y1, x2, y2, w = 0.2, c = '#000', dash) { cur.push(`<line x1="${r2(x1)}" y1="${r2(y1)}" x2="${r2(x2)}" y2="${r2(y2)}" stroke="${c}" stroke-width="${w}"${dash ? ` stroke-dasharray="${dash.join(' ')}"` : ''}/>`); },
    rect(x, y, w, h, o = {}) { cur.push(`<rect x="${r2(x)}" y="${r2(y)}" width="${r2(w)}" height="${r2(h)}" ${st(o)}/>`); },
    circle(x, y, r, o = {}) { cur.push(`<circle cx="${r2(x)}" cy="${r2(y)}" r="${r2(r)}" ${st(o)}/>`); },
    poly(pts, o = {}) { cur.push(`<polygon points="${pts.map(p => r2(p[0]) + ',' + r2(p[1])).join(' ')}" ${st(o)}/>`); },
    image(src, x, y, w, h) { cur.push(`<image href="${src}" x="${r2(x)}" y="${r2(y)}" width="${r2(w)}" height="${r2(h)}" preserveAspectRatio="xMidYMid meet"/>`); },
    tri(x1, y1, x2, y2, x3, y3, o = {}) { cur.push(`<polygon points="${r2(x1)},${r2(y1)} ${r2(x2)},${r2(y2)} ${r2(x3)},${r2(y3)}" ${st(o)}/>`); },
    text(s, x, y, o = {}) {
      const anchor = o.align === 'center' ? 'middle' : o.align === 'right' ? 'end' : 'start';
      cur.push(`<text x="${r2(x)}" y="${r2(y)}" font-size="${r2((o.size || 8) * 0.3528)}" font-family="Helvetica,Arial,sans-serif"${o.bold ? ' font-weight="bold"' : ''} text-anchor="${anchor}" fill="${o.color || '#000'}">${esc(s)}</text>`);
    },

}

    rect(x, y, w, h, o = {}) { const s = style({ lw: 0.2, ...o }); doc.rect(x, y, w, h, s); },
    circle(x, y, r, o = {}) { const s = style({ lw: 0.2, ...o }); doc.circle(x, y, r, s); },
    poly(pts, o = {}) { const s = style({ lw: 0.2, ...o }); const d = []; for (let i = 1; i < pts.length; i++) d.push([pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]]); doc.lines(d, pts[0][0], pts[0][1], [1, 1], s, true); },

const pdfSafe = s => String(s).replace(/[‐‑‒]/g, '-').replace(/≥/g, '>=').replace(/≤/g, '<=').replace(/[^\x00-\xFF€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ]/g, '?');

/* ---------------- graphic patterns ---------------- */
function pattern(cv, key, x, y, w, h) {
  if (h <= 0.05) return;
  const C = '#333', LW = 0.13;
  const L = (x1, y1, x2, y2) => cv.line(x1, y1, x2, y2, LW, C);
  const dot = (cx, cy) => cv.circle(cx, cy, 0.17, { fill: C });
  const inR = (px, py, m = 0.3) => px > x + m && px < x + w - m && py > y + m && py < y + h - m;
  const rows = (sp, fn) => { let i = 0; for (let yy = y + sp * 0.7; yy < y + h - 0.2; yy += sp, i++) fn(yy, i); };
  const diag = (sp, mirror) => {
    for (let k = -h; k < w; k += sp) {
      let x1 = k, y1 = 0, x2 = k + h, y2 = h;
      if (x1 < 0) { y1 = -x1; x1 = 0; }
      if (x2 > w) { y2 = h - (x2 - w); x2 = w; }
      if (y2 - y1 < 0.05) continue;
      const mx = v => mirror ? x + w - v : x + v;
      L(mx(x1), y + y1, mx(x2), y + y2);
    }
  };
  const dashes = (sp, len, gap, off) => rows(sp, (yy, i) => { for (let xx = x + 0.4 + (i % 2) * off; xx < x + w - 0.4; xx += len + gap) L(xx, yy, Math.min(xx + len, x + w - 0.4), yy); });
  const dots = (sp, shift = 0) => rows(sp, (yy, i) => { for (let xx = x + 0.6 + ((i + shift) % 2) * sp / 2; xx < x + w - 0.4; xx += sp) dot(xx, yy); });
  const pebbles = (sp) => rows(sp, (yy, i) => { for (let xx = x + 1 + (i % 2) * sp / 2; xx < x + w - 0.6; xx += sp) if (inR(xx, yy, 0.7)) cv.circle(xx, yy, 0.55, { stroke: C, lw: LW }); });
  switch (key) {

    if (C.smp) { cv.rect(C.smp.x + 1.2, y1, 3.2, y2 - y1, { stroke: '#000', fill, lw: 0.2 }); if (s.type === 'ST') cv.line(C.smp.x + 1.2, y1, C.smp.x + 4.4, y2, 0.15); }
    if (!first) continue;
    const ly = Math.min(Math.max(mid, y1 + 2), bBot - 0.6) + 0.9;
    if (C.smp) cv.text(`${s.type}${s.no || ''}`, C.smp.x + 5.4, ly, { size: 6 });
    const rp = recPct(P, s); if (C.rec && rp != null) cv.text(String(rp), C.rec.c, ly, { size: 6.2, align: 'center' });
    if (C.blows && s.type === 'SS' && blowsTxt(s)) cv.text(fitText(blowsTxt(s), C.blows.w - 1, 6), C.blows.c, ly, { size: 6, align: 'center' });
    if (C.blows && s.type === 'RC' && s.rqd !== '' && s.rqd != null) cv.text(`RQD ${s.rqd}`, C.blows.c, ly, { size: 6, align: 'center' });
    if (C.pid && String(s.pid ?? '').trim() !== '') cv.text(fitText(String(s.pid), C.pid.w - 1, 6.2), C.pid.c, ly, { size: 6.2, align: 'center' });
    const nv = nValue(s);
    if (C.nval) { if (nv) cv.text(nv.ref ? nv.txt : String(nv.n), C.nval.c, ly, { size: 6.2, bold: true, align: 'center' }); else if (s.type === 'RC' && s.rqd !== '' && s.rqd != null) cv.text(`RQD ${s.rqd}`, C.nval.c, ly, { size: 5, align: 'center' }); }

      cv.circle(x, md, 0.75, { fill: '#000' });
      const lab = nv.ref ? nv.txt : (nv.n > 50 ? String(nv.n) : String(nv.n));
      if (x > C.n.r - 9) cv.text(lab, x - 1.4, md - 1, { size: 5.8, align: 'right' }); else cv.text(lab, x + 1.4, md + 0.9, { size: 5.8 });

  if (C.wat && hasWell(h)) drawWell(cv, h, C.wat.c, C.wat.w - 3, Y, ps, pe, null);

  { const ft = String(S.tpl.log.footer || '').trim(); if (ft) cv.text(fitText(ft, W - 60, 5.4), M, fy, { size: 5.4 }); else cv.text('Samples: SS split spoon, ST Shelby tube, AS auger, GS grab, BS bulk, RC rock core (Rec. = TCR), DP direct push. N = blows for last 300 mm; 50/75 = refusal (blows/mm).'.replace('300 mm', U === 'm' ? '300 mm' : '12 in').replace('(blows/mm)', U === 'm' ? '(blows/mm)' : '(blows/in)'), M, fy, { size: 5.4 }); }
  cv.tri(M + 0.4, fy + 1.6, M + 3, fy + 1.6, M + 1.7, fy + 3.5, { fill: '#ffffff', stroke: BLUE, lw: 0.2 });
  cv.text('Water at time of drilling (ATD)', M + 4, fy + 3.3, { size: 5.4 });
  cv.tri(M + 36.4, fy + 1.6, M + 39, fy + 1.6, M + 37.7, fy + 3.5, { fill: BLUE, stroke: BLUE, lw: 0.2 });
  cv.text('Static water level', M + 40, fy + 3.3, { size: 5.4 });
  cv.text(`Page ${i + 1} of ${np}`, M + W, fy + 3.3, { size: 7, align: 'right', bold: true });
  cv.text(fitText(`${P.number || ''} ${h.holeId || ''}  ·  printed ${today()}`, 50, 5.4), M + W - 20, fy + 3.3, { size: 5.4, align: 'right', color: '#555' });
}

async function makePdfFor(P, holes, name) {
  if (!window.jspdf) { toast('PDF engine failed to load', true); return; }
  toast('Building PDF…');
  await new Promise(r => setTimeout(r, 30));
  try {
    const pg = S.settings.paper === 'a4' ? 'a4' : 'letter';
    const doc = new window.jspdf.jsPDF({ unit: 'mm', format: pg });
    doc.setProperties({ title: `${P.name || ''} logs`, creator: 'FieldLog ' + VERSION });
    const cv = PdfCanvas(doc); for (const h of holes) renderLog(cv, P, h);
    deliver(doc.output('blob'), name, 'PDF log ready');
  } catch (e) { console.error(e); toast('PDF failed: ' + e.message, true); }
}

    const img = new Image();
    img.onload = () => {

/* ---------------- cloud sync ----------------
   Offline-first: every device keeps a full copy. Edits are queued as "dirty" keys and pushed when online;
   other devices' changes are pulled by a server change counter (seq). Newest edit of a hole wins;
   a deleted hole stays deleted. The server is reached through an adapter, so the backend can be swapped. */
const IN_ARTIFACT = !!(window.claude && typeof window.claude.use === 'function');

/* Adapter: Supabase (GoTrue auth + PostgREST). Another backend only needs signIn / pull / push. */
const Supa = {
  name: 'Supabase',
  async req(path, opt = {}, auth = true) {
    const c = SYNC.cfg; const headers = { apikey: c.key, 'Content-Type': 'application/json' };
    if (auth) { await Supa.ensureToken(); headers.Authorization = 'Bearer ' + SYNC.session.access_token; }
    let r;
    try { r = await fetch(c.url + path, { ...opt, headers }); }
    catch (e) { const err = new Error('Cannot reach the sync server'); err.network = true; throw err; }
    if (!r.ok) {
      let msg = 'Server error ' + r.status;
      try { const j = await r.json(); msg = j.error_description || j.msg || j.message || j.error || msg; } catch (e) {}
      const err = new Error(msg); err.status = r.status; throw err;

  },
  session(j) { return { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000, email: (j.user && j.user.email) || '' }; },
  async signIn(email, password) { SYNC.session = Supa.session(await Supa.req('/auth/v1/token?grant_type=password', { method: 'POST', body: JSON.stringify({ email, password }) }, false)); },
  async ensureToken() {
    const s = SYNC.session; if (!s) { const e = new Error('Signed out'); e.signedOut = true; throw e; }
    if (Date.now() < s.expires_at - 60000) return;
    try {
      const email = s.email;
      SYNC.session = Supa.session(await Supa.req('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: JSON.stringify({ refresh_token: s.refresh_token }) }, false));
      SYNC.session.email = SYNC.session.email || email; syncSaveMeta();

  },
  pull(cursor, limit) { return Supa.req(`/rest/v1/fieldlog_records?select=*&seq=gt.${cursor}&order=seq.asc&limit=${limit}`); },
  push(records) { return Supa.req('/rest/v1/rpc/fieldlog_push', { method: 'POST', body: JSON.stringify({ records }) }); },

    cfg: SYNC.cfg && !SYNC.cfg.locked ? SYNC.cfg : null, boundTo: SYNC.boundTo }).catch(() => {});

function scheduleSync(ms) { clearTimeout(SYNC.timer); SYNC.timer = setTimeout(() => runSync(false), ms); }

function recordFor(key) {
  const [k, pid, id, ...rest] = key.split(':');
  const P = S.projects.find(p => p.id === pid);
  if (k === 'p') {
    if (!P) return null;
    const data = {}; for (const f of ['name', 'number', 'client', 'location', 'units', 'entryUnits', 'depthPerPage', 'notes', 'fence', 'crs', 'site', 'gw']) data[f] = P[f] ?? (f === 'fence' ? null : '');
    data.infoUpdatedAt = P.infoUpdatedAt;
    if (!data.fence) { try { const c = fenceCfg(P); data.fence = { holes: c.holes, name: c.name, auto: true }; } catch (e) {} } // so QGIS gets a section line
    return { id: P.id, kind: 'project', project_id: P.id, data, updated_at: P.infoUpdatedAt || now(), deleted: false };
  }
  if (k === 'h') {
    const h = P && P.holes.find(x => x.id === id); if (!h) return null;
    let geo = null; try { geo = geoInfo(P, h); } catch (e) {}
    return { id: h.id, kind: 'hole', project_id: pid, data: { ...h, _geo: geo }, updated_at: h.updatedAt, deleted: false };
  }
  if (k === 'x') return { id, kind: 'hole', project_id: pid, data: {}, updated_at: rest.join(':') || now(), deleted: true };
  if (k === 'c') return { id: TPL_ID, kind: 'config', project_id: 'company', data: S.tpl, updated_at: S.tpl.updatedAt, deleted: false };
  return null;
}
function applyRemote(row, authoritative) {
  if (row.kind === 'config') {
    if (row.id !== TPL_ID || !row.data) return false;
    if (tsCmp(row.data.updatedAt, S.tpl.updatedAt) > 0 || (authoritative && JSON.stringify(row.data) !== JSON.stringify(S.tpl))) {
      S.tpl = mergeDefaults(row.data); DB.setMeta('template', S.tpl).catch(() => {}); applyTemplate(); return true;
    }
    return false;
  }
  let P = S.projects.find(p => p.id === row.project_id);
  if (row.kind === 'project') {
    const d = row.data || {}; const stamp = d.infoUpdatedAt || row.updated_at;
    if (!P) { P = normP({ id: row.project_id, ...d, holes: [], infoUpdatedAt: stamp }); P.syncedIn = true; S.projects.push(P); save(P); return true; }
    if (tsCmp(stamp, P.infoUpdatedAt) > 0 || P.placeholder || authoritative) {
      for (const f of ['name', 'number', 'client', 'location', 'units', 'entryUnits', 'depthPerPage', 'notes', 'fence', 'crs', 'site', 'gw']) if (f in d) P[f] = f === 'fence' && d.fence && d.fence.auto ? P.fence : d[f];
      P.infoUpdatedAt = stamp; delete P.placeholder; save(P); return true;
    }
    return false;
  }
  if (!P) { P = normP({ id: row.project_id, name: '(project details syncing…)', holes: [], infoUpdatedAt: '1970-01-01T00:00:00.000Z' }); P.placeholder = true; S.projects.push(P); }
  const i = P.holes.findIndex(h => h.id === row.id);
  if (row.deleted) {
    if (!P.deleted.includes(row.id)) P.deleted.push(row.id);
    if (i >= 0) { P.holes.splice(i, 1); save(P); return true; }
    persist(P); return false;
  }
  if (P.deleted.includes(row.id) || !row.data || !row.data.id) return false;
  const h = normH(clone(row.data)); h.id = row.id; delete h._geo;
  if (i < 0) { P.holes.push(h); save(P); return true; }
  if (tsCmp(h.updatedAt, P.holes[i].updatedAt) > 0 || (authoritative && JSON.stringify(h) !== JSON.stringify(P.holes[i]))) { P.holes[i] = h; save(P); return true; }
  return false;
}
async function runSync(manual) {
  if (SYNC.busy) return;
  if (!syncReady()) { if (manual) toast(IN_ARTIFACT ? 'Sync works in the installed app, not in this preview' : 'Set up sync in Settings first', true); updSyncUI(); return; }
  if (navigator.onLine === false) { SYNC.status = 'offline'; updSyncUI(); if (manual) toast('No connection – changes will sync later'); return; }
  SYNC.busy = true; SYNC.status = 'syncing'; updSyncUI();
  let changed = false;
  try {
    await flush();
    // push in batches; only clear a key if the record was not edited again meanwhile
    const keys = [...SYNC.dirty];
    for (let i = 0; i < keys.length; i += 50) {
      const batch = keys.slice(i, i + 50).map(k => [k, recordFor(k)]);
      const recs = batch.filter(([, r]) => r).map(([, r]) => r);
      if (recs.length) {
        const res = await ADAPTER.push(recs);
        // the server keeps newer versions: adopt its copy of anything it refused
        for (const row of (res && res.refused) || []) if (applyRemote(row, true)) changed = true;
      }
      for (const [k, r] of batch) { const cur = recordFor(k); if (!r || !cur || cur.updated_at === r.updated_at) SYNC.dirty.delete(k); }
      syncSaveMeta();
    }
    // pull
    for (;;) {
      const rows = await ADAPTER.pull(SYNC.cursor, 500);
      for (const row of rows) { if (applyRemote(row)) changed = true; SYNC.cursor = Math.max(SYNC.cursor, +row.seq); }
      syncSaveMeta();
      if (rows.length < 500) break;
    }
    SYNC.lastSync = now(); SYNC.status = 'ok'; SYNC.err = ''; syncSaveMeta();
    await flush();
    if (manual) toast(changed ? 'Synced – new changes received' : 'Synced');
  } catch (e) {
    SYNC.status = e.network ? 'offline' : 'error'; SYNC.err = e.signedOut ? 'Signed out – sign in again in Settings' : e.message;
    if (manual || (!e.network && !e.signedOut)) toast('Sync: ' + SYNC.err, !e.network);
  } finally {
    SYNC.busy = false; updSyncUI();
    if (changed) safeRerender();
  }
}
/* Don't redraw under someone's thumb: wait until they leave the field they are typing in. */
function safeRerender() {
  const a = document.activeElement;
  if (a && $('#main').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) { S.needRender = true; return; }
  renderMain();
}
document.addEventListener('focusout', () => { if (S.needRender) setTimeout(() => { const a = document.activeElement; if (!(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) { S.needRender = false; renderMain(); } }, 300); });
window.addEventListener('online', () => runSync(false));
window.addEventListener('offline', () => { SYNC.status = 'offline'; updSyncUI(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && syncReady()) runSync(false); });
setInterval(() => { if (document.visibilityState === 'visible' && syncReady()) runSync(false); }, 120000);

async function syncAction(a) {
  const T = S.tmp;
  if (a === 'sync-save-server') {
    const url = String(T.url ?? (SYNC.cfg || {}).url ?? '').trim().replace(/\/+$/, ''), key = String(T.key ?? (SYNC.cfg || {}).key ?? '').trim();
    if (!/^https:\/\/.+/.test(url) && !/^http:\/\/(localhost|127\.0\.0\.1)/.test(url)) { toast('Enter the project URL, starting with https://', true); return; }
    if (!key) { toast('Enter the publishable key', true); return; }
    const changedServer = !SYNC.cfg || SYNC.cfg.url !== url;
    SYNC.cfg = { url, key }; if (changedServer) { SYNC.session = null; SYNC.boundTo = ''; }
    syncSaveMeta(); toast('Server saved – now sign in'); renderMain();
  }
  if (a === 'sync-signin') {
    if (!T.email || !T.pw) { toast('Enter email and password', true); return; }
    try {
      await ADAPTER.signIn(String(T.email).trim(), T.pw);
      if (SYNC.boundTo !== SYNC.cfg.url) syncRebind();
      S.tmp.pw = ''; syncSaveMeta(); renderMain(); toast('Signed in'); runSync(true); checkAdmin();
    } catch (e) { toast('Sign-in failed: ' + e.message, true); }
  }
  if (a === 'sync-signout') {
    if (await confirmDlg('Sign out?', `Data stays on this device. ${SYNC.dirty.size ? SYNC.dirty.size + ' unsynced change(s) will be sent next time you sign in.' : ''}`, 'Sign out')) {
      SYNC.session = null; syncSaveMeta(); renderMain();
    }
  }
  if (a === 'sync-full') { syncRebind(); runSync(true); }
  if (a === 'sync-now') runSync(true);
}

/* ---------------- AGS4 export ----------------
   AGS 4.1 transfer file: PROJ, TRAN, LOCA, HDPH, GEOL, SAMP, ISPT, CORE, WSTG + UNIT, TYPE, ABBR.
   AGS is metric: imperial projects are converted (ft → m, in → mm). */
const AGS_METHOD = [
  [/hollow/i, 'HSA', 'Hollow stem auger'], [/solid/i, 'SSA', 'Solid stem auger'], [/mud/i, 'MR', 'Mud rotary'], [/air/i, 'AR', 'Air rotary'],
  [/sonic/i, 'SON', 'Sonic drilling'], [/direct|push|geoprobe/i, 'DPT', 'Direct push'], [/core|diamond/i, 'RC', 'Rotary cored'],
  [/excavat|test pit|backhoe/i, 'TP', 'Trial pit/trench'], [/hand/i, 'HA', 'Hand auger'], [/wash/i, 'WB', 'Wash boring']];
const USCS_DESC = { GW: 'Well-graded gravel', GP: 'Poorly graded gravel', GM: 'Silty gravel', GC: 'Clayey gravel', SW: 'Well-graded sand', SP: 'Poorly graded sand', SM: 'Silty sand', SC: 'Clayey sand',
  ML: 'Silt, low plasticity', CL: 'Lean clay, low plasticity', 'CL-ML': 'Silty clay', OL: 'Organic silt or clay', MH: 'Elastic silt, high plasticity', CH: 'Fat clay, high plasticity', OH: 'Organic clay', PT: 'Peat', FILL: 'Fill', TOPSOIL: 'Topsoil', ROCK: 'Bedrock', ASPH: 'Asphalt', CONC: 'Concrete' };
const SAMP_DESC = { SS: 'Split spoon (SPT)', ST: 'Shelby tube', AS: 'Auger sample', GS: 'Grab sample', BS: 'Bulk sample', RC: 'Rock core', DP: 'Direct push liner' };

// decimal degrees -> AGS DMS text, e.g. -63.6545 -> "-63:39:16.20"
function dms(v) {
  const n = num(v); if (n == null) return '';
  const a = Math.abs(n); let d = Math.floor(a), mi = Math.floor((a - d) * 60), se = ((a - d) * 60 - mi) * 60;
  if (se >= 59.995) { se = 0; mi++; } if (mi >= 60) { mi = 0; d++; }
  return `${n < 0 ? '-' : ''}${d}:${String(mi).padStart(2, '0')}:${se.toFixed(2).padStart(5, '0')}`;
}
function buildAgs(P) {
  const imp = P.units === 'ft';
  const m = v => { const n = num(v); return n == null ? '' : (imp ? n * 0.3048 : n).toFixed(2); };      // depth/elev → 2DP metres
  const mm = v => { const n = num(v); return n == null ? '' : String(Math.round(imp ? n * 25.4 : n)); }; // diameter/penetration → mm
  const int = v => { const n = num(v); return n == null ? '' : String(Math.round(n)); };
  const abbr = new Map(); const useAbbr = (hdng, code, desc) => { if (code) abbr.set(hdng + '|' + code, [hdng, code, desc]); return code || ''; };
  const units = new Set(), types = new Set();
  const groups = [];
  // group(name, [[heading, unit, type], ...], rows)
  const group = (name, cols, rows) => { if (!rows.length) return; cols.forEach(([, u, t]) => { if (u) units.add(u); types.add(t); }); groups.push({ name, cols, rows }); };
  const holes = [...P.holes].sort((a, b) => String(a.holeId).localeCompare(String(b.holeId), undefined, { numeric: true }));
  const D = 'yyyy-mm-dd', DT = 'yyyy-mm-ddThh:mm';
  const methodOf = h => { const t = h.method || ''; const hit = AGS_METHOD.find(([re]) => re.test(t)); return hit ? [hit[1], hit[2]] : (t ? ['OTH', 'Other'] : ['', '']); };

  group('PROJ', [['PROJ_ID', '', 'ID'], ['PROJ_NAME', '', 'X'], ['PROJ_LOC', '', 'X'], ['PROJ_CLNT', '', 'X'], ['PROJ_CONT', '', 'X'], ['PROJ_MEMO', '', 'X']],
    [[P.number || P.name || 'PROJECT', P.name, P.location, P.client, [...new Set(holes.map(h => h.contractor).filter(Boolean))].join(', '), P.notes]]);
  group('TRAN', [['TRAN_ISNO', '', 'X'], ['TRAN_DATE', D, 'DT'], ['TRAN_PROD', '', 'X'], ['TRAN_STAT', '', 'X'], ['TRAN_DESC', '', 'X'], ['TRAN_AGS', '', 'X'], ['TRAN_RECV', '', 'X'], ['TRAN_DLIM', '', 'X'], ['TRAN_RCON', '', 'X'], ['TRAN_REM', '', 'X']],
    [['1', today(), 'FieldLog ' + VERSION, 'Preliminary', 'Field logging data', '4.1', P.client || 'Not specified', '|', '+', imp ? 'Converted from imperial field units' : '']]);
  group('LOCA', [['LOCA_ID', '', 'ID'], ['LOCA_TYPE', '', 'PA'], ['LOCA_NATE', 'm', '2DP'], ['LOCA_NATN', 'm', '2DP'], ['LOCA_GL', 'm', '2DP'], ['LOCA_REM', '', 'X'],
    ['LOCA_FDEP', 'm', '2DP'], ['LOCA_STAR', D, 'DT'], ['LOCA_ENDD', D, 'DT'], ['LOCA_LAT', '', 'DMS'], ['LOCA_LON', '', 'DMS'], ['LOCA_LOCM', '', 'X']],
    holes.map(h => {
      const dry = h.water.some(w => w.kind === 'Dry');
      const rem = [h.coordSys ? 'Coordinates: ' + h.coordSys : '', h.elevDatum ? 'Elevation datum: ' + h.elevDatum : '', dry ? 'Dry on completion' : '', h.backfill ? 'Backfill: ' + h.backfill : '', h.remarks].filter(Boolean).join('. ');
      return [h.holeId, useAbbr('LOCA_TYPE', h.type, h.type === 'TP' ? 'Trial pit/trench' : (HOLE_TYPES.find(t => t[0] === h.type) || [, h.type])[1]),
        num(h.easting) != null ? Number(h.easting).toFixed(2) : '', num(h.northing) != null ? Number(h.northing).toFixed(2) : '', m(h.groundElev), rem,
        m(holeDepth(h)), h.startDate || '', h.endDate || h.startDate || '', dms(h.lat), dms(h.lon), h.lat ? `GPS${h.gpsAcc ? ' +/-' + h.gpsAcc + ' m' : ''}` : ''];
    }));
  group('HDPH', [['LOCA_ID', '', 'ID'], ['HDPH_TOP', 'm', '2DP'], ['HDPH_BASE', 'm', '2DP'], ['HDPH_TYPE', '', 'PA'], ['HDPH_STAR', DT, 'DT'], ['HDPH_ENDD', DT, 'DT'],
    ['HDPH_CREW', '', 'X'], ['HDPH_EXC', '', 'X'], ['HDPH_LOG', '', 'X'], ['HDPH_REM', '', 'X'], ['HDPH_METH', '', 'X']],
    holes.flatMap(h => {

      const st = h.startDate ? h.startDate + 'T00:00' : '', en = (h.endDate || h.startDate) ? (h.endDate || h.startDate) + 'T00:00' : '';

      }
      return [[h.holeId, m(0), m(depth), code, st, en, crew, h.rig, h.logger, rem, h.method]];
    }));
  group('GEOL', [['LOCA_ID', '', 'ID'], ['GEOL_TOP', 'm', '2DP'], ['GEOL_BASE', 'm', '2DP'], ['GEOL_DESC', '', 'X'], ['GEOL_LEG', '', 'PA']],
    holes.flatMap(h => validStrata(h).map(s => { const u = uscsOf(s); return [h.holeId, m(s.top), m(s.bottom), compose(s), useAbbr('GEOL_LEG', u, USCS_DESC[u] || u)]; })));
  const samples = holes.flatMap(h => sortTop(h.samples).filter(s => num(s.top) != null).map(s => ({ h, s })));
  group('SAMP', [['LOCA_ID', '', 'ID'], ['SAMP_TOP', 'm', '2DP'], ['SAMP_REF', '', 'X'], ['SAMP_TYPE', '', 'PA'], ['SAMP_ID', '', 'ID'], ['SAMP_BASE', 'm', '2DP'], ['SAMP_RECV', '%', '0DP'], ['SAMP_REM', '', 'X']],
    samples.map(({ h, s }) => [h.holeId, m(s.top), `${s.type}${s.no || ''}`, useAbbr('SAMP_TYPE', s.type, SAMP_DESC[s.type] || s.type), `${h.holeId}-${s.type}${s.no || ''}`, m(s.bottom),
      recPct(P, s) != null ? String(recPct(P, s)) : '', [(s.labs || []).length ? 'Lab: ' + s.labs.join(', ') : '', s.pid ? 'PID ' + s.pid + ' ppm' : '', s.notes].filter(Boolean).join('. ')]));
  group('ISPT', [['LOCA_ID', '', 'ID'], ['ISPT_TOP', 'm', '2DP'], ['ISPT_SEAT', '', '0DP'], ['ISPT_MAIN', '', '0DP'], ['ISPT_NPEN', 'mm', '0DP'], ['ISPT_NVAL', '', '0DP'], ['ISPT_REP', '', 'X'], ['ISPT_REM', '', 'X']],
    samples.filter(({ s }) => s.type === 'SS' && blowsTxt(s)).map(({ h, s }) => {
      const b = (s.blows || []).map(x => String(x || '').trim());
      const parse = x => { const r = x.match(/^(\d+)\s*\/\s*(\d+(?:\.\d+)?)/); return r ? { n: +r[1], pen: +r[2], ref: true } : (num(x) != null ? { n: num(x), pen: imp ? 6 : 150 } : null); };
      const [s1, s2, s3] = b.map(parse);
      let seat = s1 ? s1.n : '', main = '', npen = '', nval = '';
      if (s1 && s1.ref) { npen = '0'; nval = String(s1.n); }
      else if (s2) {
        main = s2.n + (s3 && !s2.ref ? s3.n : 0);
        npen = mm(s2.ref ? s2.pen : (s3 ? s2.pen + s3.pen : s2.pen));
        nval = String(main);
      }
      const rep = blowsTxt(s) + (nValue(s) && !nValue(s).ref ? ` N=${nValue(s).n}` : '');
      return [h.holeId, m(s.top), seat === '' ? '' : String(seat), main === '' ? '' : String(main), npen, nval, rep, (s1 && s1.ref) || (s2 && s2.ref) || (s3 && s3.ref) ? 'Refusal' : ''];
    }));
  group('CORE', [['LOCA_ID', '', 'ID'], ['CORE_TOP', 'm', '2DP'], ['CORE_BASE', 'm', '2DP'], ['CORE_PREC', '%', '0DP'], ['CORE_RQD', '%', '0DP'], ['CORE_REM', '', 'X']],
    samples.filter(({ s }) => s.type === 'RC').map(({ h, s }) => [h.holeId, m(s.top), m(s.bottom), recPct(P, s) != null ? String(recPct(P, s)) : '', int(s.rqd), `RC${s.no || ''}${s.notes ? '. ' + s.notes : ''}`]));
  group('WSTG', [['LOCA_ID', '', 'ID'], ['WSTG_DPTH', 'm', '2DP'], ['WSTG_DTIM', DT, 'DT'], ['WSTG_REM', '', 'X']],
    holes.flatMap(h => h.water.filter(w => w.kind !== 'Dry' && num(w.depth) != null).map(w => [h.holeId, m(w.depth), w.date ? `${w.date}T${w.time || '00:00'}` : '', [w.kind, w.note].filter(Boolean).join('. ')])));

  // dictionary groups
  const TYPE_DESC = { DMS: 'Degrees:Minutes:Seconds', ID: 'Unique identifier', X: 'Text', PA: 'Text listed in ABBR Group', DT: 'Date time', '2DP': 'Value; 2 decimal places', '0DP': 'Value; 0 decimal places' };
  const UNIT_DESC = { m: 'metre', mm: 'millimetre', '%': 'percentage', [D]: 'date', [DT]: 'date and time' };
  types.add('X'); types.add('PA');
  const meta = [

    ${[...new Set([...(d.lists.uscs || []), 'FILL', ...ROCK_KEYS.map(r => r[0])])].map(u => { const g = d.gfx[u] || { pattern: 'none', color: '#dddddd' }; const rk = ROCK_KEYS.find(r => r[0] === u); const rl = rk && u !== 'ROCK' ? (u === 'ROCK-WX' ? 'Used when weathering is highly or completely weathered' : 'Rock types: ' + ROCK_CLASS[u.slice(5)].slice(0, 8).join(', ').toLowerCase() + '…') : ''; return `<tr><td><b>${esc(u)}</b><div class="small muted">${esc(rk ? rk[1] : (typeof USCS_DESC !== 'undefined' && USCS_DESC[u]) || '')}</div>${rl ? `<div class="small muted">${esc(rl)}</div>` : ''}</td>
      <td><select data-s="tpl" data-f="gfx.${u}.pattern"${can ? '' : ' disabled'}>${PATTERNS.map(([k, l]) => `<option value="${k}"${g.pattern === k ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></td>
      <td><input type="color" data-s="tpl" data-f="gfx.${u}.color" value="${esc(g.color || '#dddddd')}"${can ? '' : ' disabled'}></td>
      <td><svg class="sw" viewBox="0 0 10 14" preserveAspectRatio="none" id="gsw-${esc(u)}">${gfxSwatch(g)}</svg></td></tr>`; }).join('')}</tbody></table>`;
  }
  const lockNote = !can ? `<div class="note">Only template admins can change these settings. Ask an admin (set in the database's <b>fieldlog_admins</b> list) to make changes.</div>`
    : syncReady() && S.isAdmin ? `<div class="note info">You're a template admin. <b>Save & publish</b> sends the template to every device.</div>`
    : !syncConfigured() ? `<div class="note info">No cloud sync: changes apply to this device. Use <b>Export template</b> to share it with other devices.</div>` : '';
  const showPreview = S.desk && (tab === 'log' || tab === 'gfx');
  return topbar({ back: '#/settings', title: 'Company template', sub: (S.tpl.name || 'Company standard') + (S.tpl.updatedBy ? ` · last change by ${S.tpl.updatedBy}` : '') }) +
    `<nav class="tabs">${tabs.map(([k, l]) => `<a href="#/customize/${k}" class="${tab === k ? 'on' : ''}">${l}</a>`).join('')}</nav>
    <main class="${showPreview ? 'split' : 'wrap'}"><section class="ed">${lockNote}
    <div class="row tplbar">${can ? `<button class="btn pri" data-a="tpl-save"${dirty ? '' : ' disabled'}>${syncReady() && S.isAdmin ? 'Save & publish' : 'Save'}</button><button class="btn" data-a="tpl-discard"${dirty ? '' : ' disabled'}>Discard changes</button>` : ''}
      <button class="btn" data-a="tpl-export">Export template</button>${can ? '<button class="btn" data-a="tpl-import">Import template</button><button class="btn bad" data-a="tpl-reset">Reset to defaults</button>' : ''}${dirty ? '<span class="tag warn">Unsaved changes</span>' : ''}</div>
    ${body}</section>${showPreview ? `<aside class="pv"><div class="pv-h"><b>Preview (page 1)</b><span class="small muted">${esc(previewProject().h.holeId || '')}</span></div><div class="logs" id="tplPreview">${tplPreviewSvg()}</div></aside>` : ''}</main>`;
}
function tChkArr(f, key, on, label) { return `<label class="chk"><input type="checkbox" data-s="tpl" data-f="${f}" data-v="${key}"${on ? ' checked' : ''}${tplCanEdit() ? '' : ' disabled'}> ${esc(label)}</label>`; }
function gfxSwatch(g) { const c = SvgCanvas(10, 14); c.page(); c.rect(0, 0, 10, 14, { fill: g.color || '#dddddd' }); pattern(c, g.pattern || 'none', 0, 0, 10, 14); return c.pages[0].join(''); }
function tplInput(el) {
  if (!tplCanEdit()) return;
  const d = tplDraft(), f = el.dataset.f;
  if (el.dataset.v && el.type === 'checkbox') { const arr = getPath(d, f) || []; setPath(d, f, el.checked ? [...new Set([...arr, el.dataset.v])] : arr.filter(x => x !== el.dataset.v)); }
  else if (el.type === 'checkbox') setPath(d, f, el.checked);
  else if (f.startsWith('lists.')) setPath(d, f, el.value.split(/\r?\n/).map(x => x.trim()).filter(Boolean));
  else setPath(d, f, el.value);
  if (f.startsWith('gfx.')) { const u = f.split('.')[1]; const sw = document.getElementById('gsw-' + u); if (sw) sw.innerHTML = gfxSwatch(d.gfx[u] || {}); }
  const bar = $('.tplbar'); if (bar) { bar.querySelectorAll('[data-a="tpl-save"],[data-a="tpl-discard"]').forEach(b => b.disabled = false); if (!bar.querySelector('.tag.warn')) bar.insertAdjacentHTML('beforeend', '<span class="tag warn">Unsaved changes</span>'); }
  refreshTplPreview();
}
async function tplAction(a, el) {
  const d = tplDraft();
  if (a === 'tpl-hdr') { const k = el.dataset.v; d.log.header = el.checked ? [...d.log.header.filter(x => x !== k), k].slice(0, 16) : d.log.header.filter(x => x !== k); return renderMain(); }
  if (a === 'tpl-hdr-mv') { const h = d.log.header, i = h.indexOf(el.dataset.v), j = i + +el.dataset.d; if (j >= 0 && j < h.length) [h[i], h[j]] = [h[j], h[i]]; return renderMain(); }
  if (a === 'tpl-discard') { S.tplDraft = null; return renderMain(); }
  if (a === 'tpl-export') return tplExport();
  if (a === 'tpl-import') return $('#tplIn').click();
  if (a === 'tpl-reset') { if (await confirmDlg('Reset template?', 'All pick lists, log layout, field rules and graphics go back to the FieldLog defaults (not saved until you press Save).', 'Reset')) { const keep = { name: S.tpl.name }; S.tplDraft = { ...defaultTemplate(), ...keep }; renderMain(); } return; }
  if (a === 'tpl-save') {
    for (const [k] of LIST_INFO) if (!(d.lists[k] || []).length && !['labs'].includes(k)) { toast(`"${LIST_INFO.find(x => x[0] === k)[1]}" can't be empty`, true); return; }
    S.tpl = mergeDefaults(d); S.tplDraft = null; saveTemplate(true);
    if (syncReady()) { await runSync(false); toast(S.isAdmin ? 'Template saved and published' : 'Template saved'); } else toast('Template saved on this device');
    return renderMain();
  }
}

/* ---------------- start ---------------- */
(async function start() {
  await DB.init();
  try { S.projects = (await DB.all()).map(normP); } catch (e) { S.projects = []; }
  try { const s = await DB.getMeta('settings'); if (s) Object.assign(S.settings, s); } catch (e) {}
  await loadTemplate();
  await syncLoad();
  if (syncReady()) checkAdmin();
  try { if (navigator.storage && navigator.storage.persisted) S.persisted = await navigator.storage.persisted(); } catch (e) {}
  renderAll();
  // When running as a claude.ai artifact, file saves go through the host's downloads capability.
  try { if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(d => { DL = d; }).catch(() => {}); } catch (e) {}
  if (syncReady()) runSync(false);
  try {
    if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window) {
      const had = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => { r.update().catch(() => {}); setInterval(() => r.update().catch(() => {}), 30 * 60 * 1000); }).catch(() => {});
      // A new version took over: reload once so it shows (wait if a form is open, so nothing typed is lost).
      let done = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!had || done) return; done = true;
        const go = () => location.reload();
        if (!S.sheet && !document.querySelector('.ov .sheet')) { toast('FieldLog updated – reloading'); setTimeout(go, 900); }
        else toast('A new version of FieldLog is ready. It will load the next time you open the app.');
      });
    }
  } catch (e) {}
})();
</script>
